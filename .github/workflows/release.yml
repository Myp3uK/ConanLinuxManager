name: release

# A tag is the only thing that makes a release: the version the panel shows,
# and the one it compares against when deciding whether an update is waiting,
# is the tag stamped into the binary here.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # package.sh reads the tag with git describe, which needs the tags.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # Nothing is published that does not build and pass its tests, including
      # the packages that only compile on Linux.
      - name: Test
        run: |
          go vet ./...
          go test -race ./...

      - name: Build the package
        run: scripts/package.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/*.tar.gz.sha256
