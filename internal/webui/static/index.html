<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conan Manager</title>
<link rel="icon" href="/ui/favicon.ico" sizes="any">
<link rel="stylesheet" href="/ui/app.css">
<!-- Not deferred: it sets the palette before the first paint. -->
<script src="/ui/theme.js"></script>
<script src="/ui/app.js" defer></script>
</head>
<!-- The page starts hidden and says only that it is loading: until /me
     answers, nobody knows whether this browser is logged in, and showing the
     interface to someone who is not flashes a panel that is about to be
     replaced by the login form. -->
<body class="locked booting">
<header class="top">
  <a class="brand" href="#/">Conan Manager</a>
  <nav>
    <a href="#/" data-nav="servers">Серверы</a>
    <a href="#/events" data-nav="events">События</a>
    <a href="#/notifications" data-nav="notifications">Уведомления</a>
    <a href="#/audit" data-nav="audit">Аудит</a>
    <a href="#/panel" data-nav="panel">Панель</a>
  </nav>
  <div class="who"><span id="who"></span><button type="button" id="logout" class="ghost small" hidden>Выйти</button></div>
</header>
<main id="app"><p class="muted">Загрузка…</p></main>
<div id="toasts" aria-live="polite"></div>
<dialog id="confirm">
  <p id="confirm-text"></p>
  <div id="confirm-extra"></div>
  <div class="row end">
    <button type="button" id="confirm-cancel" class="ghost">Отмена</button>
    <button type="button" id="confirm-ok" class="danger">Да</button>
  </div>
</dialog>
</body>
</html>
